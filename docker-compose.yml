services:
  infinite-canvas:
    # Image is built & published to GHCR by GitHub Actions in THIS repo.
    image: ghcr.io/22143966/infinite-canvas-docker:latest
    container_name: infinite-canvas
    restart: unless-stopped
    ports:
      - "13200:3000"
    # ComfyUI address is configured in the WebUI (Settings -> ComfyUI),
    # not here. From inside the container, use:
    #   - ComfyUI on the Docker host      -> host.docker.internal:8188
    #   - ComfyUI on another LAN machine  -> its LAN IP, e.g. 192.168.2.102:8188
    volumes:
      - ./docker-data/API:/app/API
      - ./docker-data/assets:/app/assets
      - ./docker-data/data:/app/data
      - ./docker-data/output:/app/output
      - ./docker-data/workflows-custom:/app/workflows/custom
